<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LMP Diesel Enterprise</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e5e7eb; }
    header { padding: 16px; font-size: 20px; font-weight: bold; background: #020617; }
    .container { padding: 16px; max-width: 1600px; margin: auto; }
    .card { background: #020617; padding: 16px; border-radius: 14px; margin-bottom: 16px; }
    input, select, button { margin: 4px; padding: 6px 10px; border-radius: 4px; font-size: 14px; }
    button { background: #3b82f6; color: white; border: none; cursor: pointer; }
    button:hover { background: #2563eb; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }
    button.ghost { background: #1f2937; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #1f2937; padding: 6px; text-align: center; }
    th { background: #020617; position: sticky; top: 0; z-index: 1; }
    .left { text-align: left; }
    .muted { color: #94a3b8; font-size: 0.9em; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .flex-1 { flex: 1; min-width: 200px; }
    .balance-green { color: #86efac; }
    .balance-red   { color: #fca5a5; }
    .balance-gray  { color: #cbd5e1; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #1f2937; color: #cbd5e1; font-size: 12px; }
    .unsaved-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#fbbf24; vertical-align:middle; margin-left:6px; }
    .progress-bar { margin-top: 6px; width: 100%; background: #1f2937; height: 8px; border-radius: 6px; overflow: hidden; }
    .progress-bar > div { height: 100%; background: #3b82f6; transition: width 180ms; }
    .flash { padding: 10px 12px; border-radius: 8px; }
    .flash.success { background:#064e3b; color:#d1fae5; border:1px solid #065f46; }
    .flash.error { background:#7f1d1d; color:#fee2e2; border:1px solid #991b1b; }
    .section-subtle { border-top:1px solid #1f2937; padding-top:8px; margin-top:8px; }
    .error { color: #fca5a5; font-size: 12px; margin-top: 2px; }
    .input-error { border: 1px solid #ef4444; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getDatabase,
      ref, set, onValue, update, get, push, remove, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    // ✅ Your Firebase config (unchanged)
    const firebaseConfig = {
      apiKey: "AIzaSyB4WcFUhQLHYSU6lecY9xWAQYjApNp9LG4",
      authDomain: "studio-6256088054-e3eee.firebaseapp.com",
      databaseURL: "https://studio-6256088054-e3eee-default-rtdb.firebaseio.com",
      projectId: "studio-6256088054-e3eee",
      storageBucket: "studio-6256088054-e3eee.firebasestorage.app",
      messagingSenderId: "551506815271",
      appId: "1:551506815271:web:f55987b56469db956e2102",
      measurementId: "G-FYSMRPVYMX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const { useState, useEffect, useMemo } = React;

    // ───────────────────────── Helpers ─────────────────────────
    function isValidNonNegativeNumber(v, max = Number.MAX_SAFE_INTEGER) {
      if (v === '' || v === null || v === undefined) return false;
      const n = Number(v);
      return Number.isFinite(n) && n >= 0 && n <= max;
    }
    function isDateInMonth(isoDate, ym) {
      if (!isoDate || !ym) return false;
      const d = new Date(isoDate);
      if (isNaN(d.getTime())) return false;
      const [y, m] = ym.split('-').map(Number);
      return d.getFullYear() === y && (d.getMonth() + 1) === m;
    }
    function daysInMonth(ym) {
      const [y, m] = ym.split('-').map(Number);
      return new Date(y, m, 0).getDate();
    }
    const safeId = (suffix='') => `${Date.now()}_${Math.floor(Math.random()*1e6)}${suffix ? '_' + suffix : ''}`;

    // CSV helpers
    function splitCSVLine(line) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (ch === ',' && !inQuotes) {
          result.push(cur); cur = '';
        } else {
          cur += ch;
        }
      }
      result.push(cur);
      return result;
    }

    // ───────────────────────── App ─────────────────────────
    function App() {
      const [user, setUser] = useState(null);

      // profile
      const [role, setRole] = useState('staff');
      const [company, setCompany] = useState('');
      const [site, setSite] = useState('');
      const [profileLoading, setProfileLoading] = useState(false);
      const [profileError, setProfileError] = useState('');

      useEffect(() => {
        const unsub = onAuthStateChanged(auth, u => {
          setUser(u);
          setProfileError('');

          if (!u) {
            setRole('staff'); setCompany(''); setSite('');
            setProfileLoading(false);
            return;
          }

          setProfileLoading(true);

          const userRef = ref(db, `users/${u.uid}`);
          const off = onValue(userRef,
            snap => {
              if (snap.exists()) {
                const v = snap.val() || {};
                setRole(v.role || 'staff');
                setCompany(v.company || 'LMP');
                setSite(v.site || 'Jafurah');
              } else {
                // first-time profile
                set(userRef, { email: u.email, role: 'admin', company: 'LMP', site: 'Jafurah' });
                setRole('admin'); setCompany('LMP'); setSite('Jafurah');
              }
              setProfileLoading(false);
            },
            err => {
              console.error("Profile read error:", err);
              setProfileError(err?.message || String(err));
              setProfileLoading(false);
            }
          );

          return () => off;
        });

        return unsub;
      }, []);

      return React.createElement('div', null,
        React.createElement('header', null, '⛽ LMP Diesel Enterprise'),
        React.createElement('div', { className: 'container' },
          !user && React.createElement(AuthForm),
          user && profileLoading && React.createElement('div', { className: 'card' }, 'Loading profile...'),
          user && profileError && React.createElement('div', { className: 'card' },
            React.createElement('div', { className: 'flash error' }, `Profile Error: ${profileError}`)
          ),
          user && !profileLoading && !profileError && company && site &&
            React.createElement(Dashboard, { user, role, company, site, setCompany, setSite })
        )
      );
    }

    // ───────────────────────── Auth ─────────────────────────
    function AuthForm() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [msg, setMsg] = useState('');
      const [errors, setErrors] = useState({ email: '', password: '' });

      const validate = () => {
        const e = { email: '', password: '' };
        if (!email || !/^\S+@\S+\.\S+$/.test(email)) e.email = 'Enter a valid email address.';
        if (!password || password.length < 6) e.password = 'Password must be at least 6 characters.';
        setErrors(e);
        return !e.email && !e.password;
      };

      const login = () => {
        if (!validate()) return;
        signInWithEmailAndPassword(auth, email, password).catch(e => setMsg(e.message));
      };

      const register = () => {
        if (!validate()) return;
        createUserWithEmailAndPassword(auth, email, password)
          .then(cred => set(ref(db, `users/${cred.user.uid}`), { email, role: 'admin', company: 'LMP', site: 'Jafurah' }))
          .catch(e => setMsg(e.message));
      };

      return React.createElement('div', { className: 'card' },
        React.createElement('h3', null, 'Login / Register'),
        React.createElement('div', null,
          React.createElement('input', {
            type: 'email',
            placeholder: 'Email',
            value: email,
            onChange: e => setEmail(e.target.value),
            className: errors.email ? 'input-error' : ''
          }),
          errors.email && React.createElement('div', { className: 'error' }, errors.email)
        ),
        React.createElement('div', null,
          React.createElement('input', {
            type: 'password',
            placeholder: 'Password',
            value: password,
            onChange: e => setPassword(e.target.value),
            className: errors.password ? 'input-error' : ''
          }),
          errors.password && React.createElement('div', { className: 'error' }, errors.password)
        ),
        React.createElement('div', { className: 'row' },
          React.createElement('button', { onClick: login }, 'Login'),
          React.createElement('button', { onClick: register }, 'Register (Admin)')
        ),
        msg && React.createElement('div', { style: { color: '#fca5a5', marginTop: '8px' } }, msg)
      );
    }

    // ───────────────────────── Dashboard ─────────────────────────
    function Dashboard({ user, role, company, site, setCompany, setSite }) {
      const [ym, setYm] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      });
      const [view, setView] = useState('sheet');

      // ✅ basePath: consistent everywhere
      const basePath = useMemo(() => {
        return `companies/${company}/sites/${site}/users/${user.uid}`;
      }, [company, site, user.uid]);

      const [equipments, setEquipments] = useState([]);

      // pending multi-path updates
      const [pending, setPending] = useState({});
      const [receivedDrafts, setReceivedDrafts] = useState([]);

      const [importProgress, setImportProgress] = useState({ running: false, phase: '', processed: 0, total: 0, cells: 0, errors: 0 });
      const [flash, setFlash] = useState(null);

      const showFlash = (type, text) => {
        setFlash({ type, text });
        setTimeout(() => setFlash(null), 3500);
      };

      // ✅ Equipments subscription: sort by CSV order (order), fallback by name
      useEffect(() => {
        const eqRef = ref(db, `${basePath}/sheets/${ym}/equipments`);
        return onValue(eqRef, snap => {
          const arr = [];
          if (snap.exists()) {
            snap.forEach(c => {
              const v = c.val() || {};
              arr.push({ id: c.key, name: v.name || '', order: v.order });
            });
          }
          arr.sort((a,b) => {
            const ao = (a.order ?? 999999999);
            const bo = (b.order ?? 999999999);
            if (ao !== bo) return ao - bo;
            return (a.name || '').localeCompare(b.name || '');
          });
          setEquipments(arr);
        }, err => {
          console.error("Equipments read failed:", err);
          showFlash('error', err?.message || String(err));
        });
      }, [basePath, ym]);

      const queueUpdate = (path, value) => {
        setPending(prev => {
          const next = { ...prev };
          if (value === undefined) delete next[path];
          else next[path] = value;
          return next;
        });
      };

      const hasPending = (path) => Boolean(pending[path]);
      const pendingCount = Object.keys(pending).length + receivedDrafts.length;

      const saveAll = async () => {
        const pathCount = Object.keys(pending).length;
        const draftsCount = receivedDrafts.length;

        // validate pending numeric values
        for (const [p, v] of Object.entries(pending)) {
          if (typeof v === 'number' && (!Number.isFinite(v) || v < 0)) {
            alert('There are invalid numeric values. Please fix highlighted fields before saving.');
            return;
          }
        }
        if (pathCount === 0 && draftsCount === 0) {
          alert('No changes to save.');
          return;
        }

        try {
          const updates = { ...pending };
          const recvRoot = `${basePath}/received/${ym}`;

          receivedDrafts.forEach((d, i) => {
            const key = safeId(i);
            updates[`${recvRoot}/${key}`] = {
              date: d.date,
              quantity: Number(d.quantity) || 0,
              notes: d.notes || '',
              ts: serverTimestamp()
            };
          });

          await update(ref(db), updates);
          setPending({});
          setReceivedDrafts([]);
          showFlash('success', `Saved ${pathCount} change(s) and ${draftsCount} received entr${draftsCount === 1 ? 'y' : 'ies'}.`);
        } catch (e) {
          console.error("SaveAll failed:", e);
          showFlash('error', `Save failed: ${e?.message || e}`);
          alert('Save failed: ' + (e?.message || e));
        }
      };

      const discardAll = () => {
        const total = Object.keys(pending).length + receivedDrafts.length;
        if (total === 0) return;

        const ok = confirm(
          `Discard unsaved changes?\n\n` +
          `• Pending cell/opening changes: ${Object.keys(pending).length}\n` +
          `• Draft received entries: ${receivedDrafts.length}\n\n` +
          `This will revert to last saved data.`
        );
        if (!ok) return;

        setPending({});
        setReceivedDrafts([]);
        showFlash('success', 'All pending changes discarded.');
      };

      return React.createElement('div', null,
        React.createElement('div', { className: 'card row' },
          React.createElement('div', null, `User: ${user.email}`),
          React.createElement('div', null, `Role: ${role}`),
          React.createElement('button', { onClick: () => signOut(auth) }, 'Logout'),
          React.createElement('span', { className: 'muted' }, ' | Company: '),
          React.createElement('input', {
            value: company,
            onChange: e => setCompany(e.target.value),
            disabled: role !== 'admin',
            style: { width: '140px' }
          }),
          React.createElement('span', { className: 'muted' }, ' Site: '),
          React.createElement('input', {
            value: site,
            onChange: e => setSite(e.target.value),
            disabled: role !== 'admin',
            style: { width: '140px' }
          })
        ),

        React.createElement(MonthlyBalanceSummary, { basePath, ym, queueUpdate, hasPending }),

        React.createElement('div', { className: 'card row' },
          React.createElement('h3', null, 'Month'),
          React.createElement('input', { type: 'month', value: ym, onChange: e => setYm(e.target.value) }),
          React.createElement('button', { onClick: () => exportCSV(basePath, ym, company, site) }, 'Export CSV'),
          React.createElement('button', { onClick: () => window.location.reload() }, 'Refresh'),
          React.createElement('button', { onClick: () => setView('sheet') }, 'Sheet'),
          React.createElement('button', { onClick: () => setView('report') }, 'Report')
        ),

        React.createElement('div', { className: 'card' },
          React.createElement('div', { className: 'row' },
            React.createElement('h3', null, 'Finalize'),
            React.createElement('span', { className: 'pill' }, `Pending: ${pendingCount}`),
            React.createElement('button', { onClick: saveAll, disabled: pendingCount === 0 }, 'Save All'),
            React.createElement('button', { className: 'ghost', onClick: discardAll, disabled: pendingCount === 0 }, 'Discard Changes')
          ),
          flash && React.createElement('div', { className: `flash ${flash.type} section-subtle` }, flash.text)
        ),

        React.createElement('div', { className: 'card' },
          React.createElement('h3', null, 'Daily Consumption'),
          React.createElement(DailyEntryForm, { basePath, ym, equipments })
        ),

        React.createElement('div', { className: 'card' },
          React.createElement('h3', null, 'Diesel Received'),
          React.createElement(ReceivedDraftForm, { ym, onDraft: (entry) => setReceivedDrafts(prev => [...prev, entry]) }),
          React.createElement(ReceivedSummary, { basePath, ym, drafts: receivedDrafts, removeDraft: (id) => setReceivedDrafts(prev => prev.filter(d => d.id !== id)) })
        ),

        React.createElement('div', { className: 'card' },
          React.createElement('div', { className: 'row' },
            React.createElement('h3', null, 'Import CSV'),
            React.createElement('input', { type: 'file', accept: '.csv', id: 'importFile' }),
            React.createElement('button', {
              onClick: () => importCSV(basePath, ym, setEquipments, setImportProgress),
              disabled: importProgress.running
            }, importProgress.running ? 'Importing…' : 'Import')
          ),
          (importProgress.running || importProgress.phase) && React.createElement('div', { className: 'section-subtle' },
            React.createElement('div', { className: 'muted' }, importProgress.phase || 'Ready'),
            (importProgress.total > 0) && React.createElement('div', null,
              `Rows: ${importProgress.processed}/${importProgress.total} | Cells: ${importProgress.cells} | Errors: ${importProgress.errors}`
            ),
            (importProgress.total > 0) && React.createElement('div', { className: 'progress-bar' },
              React.createElement('div', { style: { width: `${Math.min(100, Math.round((importProgress.processed / importProgress.total) * 100))}%` } })
            )
          )
        ),

        React.createElement('div', { className: 'card' },
          React.createElement('h3', null, 'Equipments'),
          React.createElement(EquipmentManager, { basePath, ym, role, equipments })
        ),

        view === 'sheet' && React.createElement('div', { className: 'card' },
          React.createElement('h3', null, `Consumption Sheet – ${company} / ${site}`),
          React.createElement(MonthlySheet, { basePath, ym, role, equipments, queueUpdate, hasPending })
        ),

        view === 'report' && React.createElement('div', { className: 'card' },
          React.createElement(PerEquipmentReport, { basePath, ym, equipments })
        )
      );
    }

    // ───────────────────────── Balance & Totals ─────────────────────────
    async function getMonthlyTotals(basePath, ym) {
      const [receivedSnap, dataSnap, openingSnap] = await Promise.all([
        get(ref(db, `${basePath}/received/${ym}`)),
        get(ref(db, `${basePath}/sheets/${ym}/data`)),
        get(ref(db, `${basePath}/sheets/${ym}/openingStock`))
      ]);

      let received = 0;
      receivedSnap.exists() && receivedSnap.forEach(c => received += Number(c.val().quantity || 0));

      let consumed = 0;
      if (dataSnap.exists()) {
        const data = dataSnap.val() || {};
        Object.values(data).forEach(row => {
          Object.values(row || {}).forEach(v => consumed += Number(v || 0));
        });
      }

      const opening = Number(openingSnap.val() || 0);
      return { opening, received, consumed, closing: opening + received - consumed };
    }

    function MonthlyBalanceSummary({ basePath, ym, queueUpdate, hasPending }) {
      const [totals, setTotals] = useState({ opening: 0, received: 0, consumed: 0, closing: 0 });
      const [loading, setLoading] = useState(true);
      const [openingDraft, setOpeningDraft] = useState(0);
      const [err, setErr] = useState('');

      useEffect(() => {
        setLoading(true);
        getMonthlyTotals(basePath, ym).then(t => {
          setTotals(t);
          setOpeningDraft(t.opening);
          setErr('');
          setLoading(false);
        }).catch(e => {
          console.error("Totals failed:", e);
          setLoading(false);
        });
      }, [basePath, ym]);

      const color = totals.closing > 0 ? 'balance-green' : totals.closing < 0 ? 'balance-red' : 'balance-gray';
      const openingPath = `${basePath}/sheets/${ym}/openingStock`;

      const queueOpening = () => {
        if (!isValidNonNegativeNumber(openingDraft, 100000000)) {
          setErr('Opening must be a non-negative number (max 100,000,000).');
          return;
        }
        setErr('');
        queueUpdate(openingPath, Number(openingDraft));
        alert('Opening stock change queued. Click "Save All" to apply.');
      };

      return React.createElement('div', { className: 'card' },
        React.createElement('h3', null, `Balance – ${ym}`),
        loading ? 'Loading...' : React.createElement('div', { className: 'row', style: { justifyContent: 'space-between', textAlign: 'center' } },
          ['Opening', 'Received', 'Consumed', 'Closing'].map((label, i) => {
            const val = [totals.opening, totals.received, totals.consumed, totals.closing][i];
            const node = i === 0
              ? React.createElement('div', null,
                  React.createElement('div', { className: 'muted' }, 'Opening'),
                  React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'center' } },
                    React.createElement('input', {
                      type: 'number',
                      value: openingDraft,
                      onChange: e => setOpeningDraft(e.target.value),
                      style: { width: '160px', textAlign: 'right' },
                      className: err ? 'input-error' : ''
                    }),
                    hasPending(openingPath) ? React.createElement('span', { className: 'unsaved-dot', title: 'Opening queued' }) : null,
                    React.createElement('button', { onClick: queueOpening }, 'Queue')
                  ),
                  err && React.createElement('div', { className: 'error' }, err)
                )
              : React.createElement('div', null,
                  React.createElement('div', { className: 'muted' }, label),
                  React.createElement('div', { className: i === 3 ? color : '', style: { fontSize: i === 3 ? '1.6em' : '1.3em', fontWeight: 'bold' } },
                    (Number(val) || 0).toLocaleString()
                  )
                );
            return React.createElement('div', { key: label }, node);
          })
        )
      );
    }

    // ───────────────────────── Equipments Manager ─────────────────────────
    function EquipmentManager({ basePath, ym, role, equipments }) {
      const [newName, setNewName] = useState('');

      const addEquipment = async () => {
        if (role !== 'admin') return;
        const name = (newName || '').trim();
        if (!name) return alert('Enter equipment name');

        const exists = (equipments || []).some(e => (e.name || '').trim().toLowerCase() === name.toLowerCase());
        if (exists) return alert('Equipment already exists');

        const listRef = ref(db, `${basePath}/sheets/${ym}/equipments`);
        const newRef = push(listRef);
        const maxOrder = (equipments || []).reduce((m, e) => Math.max(m, Number(e.order ?? 0)), 0);

        await set(newRef, { name, order: maxOrder + 1 });
        setNewName('');
      };

      const deleteEquipment = async (eq) => {
        if (role !== 'admin') return;
        if (!confirm(`Delete "${eq.name}"?\n\nThis also deletes its data for ${ym}.`)) return;
        await remove(ref(db, `${basePath}/sheets/${ym}/equipments/${eq.id}`));
        await remove(ref(db, `${basePath}/sheets/${ym}/data/${eq.id}`));
      };

      return React.createElement('div', null,
        role === 'admin' && React.createElement('div', { className: 'row' },
          React.createElement('input', {
            className: 'flex-1',
            placeholder: 'New equipment name',
            value: newName,
            onChange: e => setNewName(e.target.value)
          }),
          React.createElement('button', { onClick: addEquipment }, '+ Add')
        ),
        React.createElement('table', { style: { marginTop: '10px' } },
          React.createElement('thead', null,
            React.createElement('tr', null,
              React.createElement('th', { className: 'left' }, 'Equipment'),
              React.createElement('th', null, 'Order'),
              React.createElement('th', null, 'Action')
            )
          ),
          React.createElement('tbody', null,
            (equipments || []).map(eq =>
              React.createElement('tr', { key: eq.id },
                React.createElement('td', { className: 'left' }, eq.name),
                React.createElement('td', null, eq.order ?? ''),
                React.createElement('td', null,
                  role === 'admin'
                    ? React.createElement('button', { className: 'danger', onClick: () => deleteEquipment(eq) }, 'Delete')
                    : '—'
                )
              )
            )
          )
        )
      );
    }

    // ───────────────────────── Daily Entry (uses ID) ─────────────────────────
    function DailyEntryForm({ basePath, ym, equipments }) {
      const [date, setDate] = useState('');

// ───────────────────────── Import CSV (Option B) ─────────────────────────
async function importCSV(basePath, ym, setEquipments, setImportProgress) {
  const file = document.getElementById('importFile')?.files?.[0];
  if (!file) return alert('Select CSV file');

  const updateProgress = (patch) =>
    setImportProgress(prev => ({ ...prev, ...patch }));

  updateProgress({ running: true, phase: 'Reading file…', processed: 0, total: 0, cells: 0, errors: 0 });

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const text = String(e.target.result || '');
      const rawLines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      const lines = rawLines.map(l => l.trim()).filter(l => l.length > 0);

      if (lines.length < 2) {
        updateProgress({ running: false, phase: 'Invalid CSV (no data rows).' });
        return alert('Invalid CSV (no data rows)');
      }

      const header = splitCSVLine(lines[0]).map(h => (h || '').trim());

      // ✅ IMPORTANT: With your new CSV format "...,total,,Date,liter,note"
      // total is NOT the last column, so we must find it by name.
      const totalIndex = header.findIndex(h => (h || '').trim().toLowerCase() === 'total');
      if (totalIndex === -1) {
        updateProgress({ running: false, phase: 'Invalid CSV (missing Total column).' });
        return alert('Invalid CSV (missing Total column)');
      }

      // ✅ Received columns (right side)
      const dateColIndex  = header.findIndex(h => (h || '').trim().toLowerCase() === 'date');
      const literColIndex = header.findIndex(h => (h || '').trim().toLowerCase() === 'liter');
      const noteColIndex  = header.findIndex(h => (h || '').trim().toLowerCase() === 'note');

      const monthDays = daysInMonth(ym);

      // Day columns are between equipment (col0) and total
      const headerDayCount = Math.max(0, totalIndex - 1);
      const dayCols = Math.min(headerDayCount, monthDays);

      // Map day -> column index by header label "1..N"
      const dayToColIndex = new Array(dayCols + 1);
      for (let d = 1; d <= dayCols; d++) {
        let idx = -1;
        for (let j = 1; j < totalIndex; j++) {
          if (header[j] === String(d)) { idx = j; break; }
        }
        dayToColIndex[d] = (idx !== -1) ? idx : d;
      }

      // preserve blank vs zero for equipment day cells
      function parseNumericCell(raw) {
        const s = (raw ?? '').toString().trim();
        if (s === '') return null;          // blank
        const n = Number(s);
        return Number.isFinite(n) ? n : null;
      }

      // ✅ Received liter parsing (blank -> null)
      function parseReceivedLiter(raw) {
        const s = (raw ?? '').toString().trim();
        if (s === '') return null;
        const n = Number(s);
        return Number.isFinite(n) ? n : null;
      }

      // ✅ Date-only normalize for dedupe/upsert (date only, not quantity)
      function normalizeReceiveDate(s) {
        return (s || '').toString().trim().replace(/\s+/g, ' ').toLowerCase();
      }

      updateProgress({ phase: 'Scanning existing equipments…' });

      const eqRef = ref(db, `${basePath}/sheets/${ym}/equipments`);
      const eqRoot = `${basePath}/sheets/${ym}/equipments`;
      const dataRoot = `${basePath}/sheets/${ym}/data`;
      const recvRoot = `${basePath}/received/${ym}`;

      const exSnap = await get(eqRef);
      const nameToId = {};
      if (exSnap.exists()) {
        exSnap.forEach(c => {
          const v = c.val() || {};
          const storedName = (v.name || '').trim();
          if (storedName) nameToId[storedName.toLowerCase()] = c.key;
        });
      }

      // ✅ NEW: Load existing received entries once and map by normalized date -> record id
      // If duplicates already exist for same date, keep the one with latest ts.
      const receiveDateToId = {};
      const recvSnap = await get(ref(db, recvRoot));
      if (recvSnap.exists()) {
        recvSnap.forEach(c => {
          const v = c.val() || {};
          const key = normalizeReceiveDate(v.date);
          if (!key) return;

          const existing = receiveDateToId[key];
          if (!existing) {
            receiveDateToId[key] = { id: c.key, ts: v.ts || 0 };
          } else {
            const curTs = v.ts || 0;
            if (curTs > (existing.ts || 0)) {
              receiveDateToId[key] = { id: c.key, ts: curTs };
            }
          }
        });
      }

      const totalRows = lines.length - 1;
      updateProgress({ phase: 'Parsing CSV rows…', total: totalRows, processed: 0 });

      const BATCH_SIZE = 4000;
      let batch = {};
      let batchCells = 0;

      let processed = 0;
      let globalCells = 0;
      let errorCount = 0;
      const addedNames = new Set();

      // ✅ NEW: per-import tracker: date -> targetId (so multiple CSV rows update same record)
      const importedReceiveTargets = {};

      async function flushBatch() {
        if (Object.keys(batch).length === 0) return;
        try {
          await update(ref(db), batch);
        } catch (err) {
          console.error("Import update failed:", err, batch);
          throw err;
        } finally {
          batch = {};
          batchCells = 0;
        }
      }

      for (let i = 1; i < lines.length; i++) {
        try {
          const cells = splitCSVLine(lines[i]);
          if (cells.length < 1) { processed++; continue; }

          const name = (cells[0] || '').trim();

          // ✅ Read received columns from this row
          let rDate = '';
          let rLiter = null;
          let rNote = '';

          if (dateColIndex !== -1)  rDate  = (cells[dateColIndex] || '').trim();
          if (literColIndex !== -1) rLiter = parseReceivedLiter(cells[literColIndex]);
          if (noteColIndex !== -1)  rNote  = (cells[noteColIndex] || '').trim();

          // ✅ UPDATED: received upsert by date
          // If date already exists in DB -> update same entry
          // Else -> create once
          async function addReceivedUpsertByDate() {
            const key = normalizeReceiveDate(rDate);
            if (!key) return;

            // Only import/update if date exists AND liter cell is present (same rule as before)
            if (rLiter === null) return;

            // Choose record id to update/insert:
            // 1) if already used this import, keep using it
            // 2) else if exists in DB, update that one
            // 3) else create new
            let targetId =
              importedReceiveTargets[key] ||
              receiveDateToId[key]?.id ||
              null;

            if (!targetId) {
              targetId = push(ref(db, recvRoot)).key;
              receiveDateToId[key] = { id: targetId, ts: Date.now() };
            }

            importedReceiveTargets[key] = targetId;

            // Upsert (overwrite quantity/notes for that date)
            batch[`${recvRoot}/${targetId}`] = {
              date: rDate,
              quantity: rLiter,
              notes: rNote,
              ts: Date.now()
            };
            batchCells++;

            if (batchCells >= BATCH_SIZE) {
              updateProgress({ phase: `Writing batch… (${globalCells} cells)`, processed, cells: globalCells });
              await flushBatch();
              updateProgress({ phase: `Parsing CSV rows…`, processed, cells: globalCells });
            }
          }

          // ✅ If equipment name is blank: still allow receive-only rows
          if (!name) {
            await addReceivedUpsertByDate();
            processed++;
            continue;
          }

          const norm = name.toLowerCase();
          let id = nameToId[norm];

          const csvOrder = i; // source-of-truth order (row position)

          // read day values
          const dayValues = new Array(dayCols + 1);
          for (let d = 1; d <= dayCols; d++) {
            const colIndex = dayToColIndex[d];
            dayValues[d] = parseNumericCell(cells[colIndex]); // null blank, 0 preserved
          }

          if (!id) {
            // Option B: create equipment even if no values
            const newRef = push(eqRef);
            await set(newRef, { name, order: csvOrder });
            id = newRef.key;
            nameToId[norm] = id;
            addedNames.add(name);
          } else {
            // existing: set order to match CSV
            batch[`${eqRoot}/${id}/order`] = csvOrder;
          }

          // write cells: write numeric (including 0), skip blanks
          for (let d = 1; d <= dayCols; d++) {
            const v = dayValues[d];
            if (v !== null) {
              batch[`${dataRoot}/${id}/${d}`] = v;
              batchCells++;
              globalCells++;
            }

            if (batchCells >= BATCH_SIZE) {
              updateProgress({ phase: `Writing batch… (${globalCells} cells)`, processed, cells: globalCells });
              await flushBatch();
              updateProgress({ phase: `Parsing CSV rows…`, processed, cells: globalCells });
            }
          }

          // ✅ import received from same row, but UPSERT by date
          await addReceivedUpsertByDate();

        } catch (err) {
          errorCount++;
          console.error("Row import error:", err);
        } finally {
          processed++;
          if (processed % 10 === 0 || processed === totalRows) {
            updateProgress({ processed, cells: globalCells, errors: errorCount });
            await new Promise(r => setTimeout(r, 0));
          }
        }
      }

      if (batchCells > 0) {
        updateProgress({ phase: `Finalizing… (${globalCells} cells)` });
        await flushBatch();
      }

      // refresh equipments
      updateProgress({ phase: 'Refreshing equipments…' });
      const snap = await get(eqRef);
      const arr = [];
      snap.exists() && snap.forEach(c => arr.push({ id: c.key, ...(c.val() || {}) }));

      arr.sort((a,b) => (a.order ?? 999999999) - (b.order ?? 999999999));
      setEquipments(arr);

      updateProgress({
        running: false,
        phase: `Import finished. Added: ${addedNames.size}, Cells written: ${globalCells}, Errors: ${errorCount}`,
        errors: errorCount
      });

      alert(`Import finished.\nAdded: ${addedNames.size}\nCells written: ${globalCells}\nErrors: ${errorCount}`);

    } catch (err) {
      console.error("Import failed:", err);
      setImportProgress(prev => ({ ...prev, running: false, phase: `Import failed: ${err?.message || String(err)}` }));
      alert(`Import failed: ${err?.message || String(err)}`);
    }
  };

  reader.readAsText(file);
}
// ───────────────────────── Export CSV (Equipment rows + Receive on right side in top rows) ─────────────────────────
async function exportCSV(basePath, ym, company, site) {
  try {
    const MAX_DAYS = 31;
    const actualDays = daysInMonth(ym);

    const [eqSnap, dataSnap, recvSnap] = await Promise.all([
      get(ref(db, `${basePath}/sheets/${ym}/equipments`)),
      get(ref(db, `${basePath}/sheets/${ym}/data`)),
      get(ref(db, `${basePath}/received/${ym}`))
    ]);

    const data = dataSnap.exists() ? (dataSnap.val() || {}) : {};

    // ✅ Build full equipment list (fix: if equipments node has only 1, still export all from data)
    const eqMap = new Map();

    if (eqSnap.exists()) {
      eqSnap.forEach(c => {
        const v = c.val() || {};
        eqMap.set(c.key, { id: c.key, name: v.name || c.key, order: v.order });
      });
    }

    // Add missing equipment IDs from data
    for (const id of Object.keys(data || {})) {
      if (!eqMap.has(id)) {
        eqMap.set(id, { id, name: id, order: 999999999 });
      }
    }

    const eqs = Array.from(eqMap.values()).sort(
      (a, b) => (a.order ?? 999999999) - (b.order ?? 999999999)
    );

    // ✅ Received list
    const received = [];
    if (recvSnap.exists()) {
      recvSnap.forEach(c => {
        const v = c.val() || {};
        received.push({
          id: c.key,
          date: v.date || '',
          liter: Number(v.quantity || 0),
          note: v.notes || '',
          ts: v.ts || ''
        });
      });
    }

    // Sort as you want (latest first). If you want oldest first, swap a/b.
    received.sort((a, b) => (Number(b.ts) || 0) - (Number(a.ts) || 0));

    // CSV escape helper
    function escapeCSVField(v) {
      if (v === null || v === undefined) return '';
      const s = String(v);
      if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
      return s;
    }

    // ✅ Header EXACT like your file: total then ONE blank column then Date,liter,note
    let csv =
      'equipment,' +
      Array.from({ length: MAX_DAYS }, (_, i) => i + 1).join(',') +
      ',total,,Date,liter,note\n';

    // ✅ Main export: equipment rows always printed
    // ✅ Receive is placed beside top rows (zip by index)
    for (let i = 0; i < eqs.length; i++) {
      const eq = eqs[i];
      const row = (data && data[eq.id]) || {};

      let tot = 0;
      const vals = [];

      for (let d = 1; d <= MAX_DAYS; d++) {
        if (d > actualDays) {
          vals.push('');
          continue;
        }

        const raw = row?.[d];

        if (raw === undefined || raw === null || raw === '') {
          vals.push('');
          continue;
        }

        const v = Number(raw);
        if (!Number.isFinite(v) || v === 0) {
          // ✅ 0 treated as no value -> blank
          vals.push('');
          continue;
        }

        tot += v;
        vals.push(v);
      }

      // ✅ receive values on same row for first N rows
      const r = received[i]; // zip by row index (this is what your sample shows)

      const rDate = r ? r.date : '';
      const rLiter = r ? (r.liter === 0 ? '' : r.liter) : '';
      const rNote = r ? r.note : '';

      csv += `${escapeCSVField(eq.name)},${vals.join(',')},${tot},,${escapeCSVField(rDate)},${escapeCSVField(rLiter)},${escapeCSVField(rNote)}\n`;
      //                                             ^ blank column after total (two commas)
    }

    // ✅ If received has MORE rows than equipment, add extra receive-only rows (optional)
    // If you DO NOT want extra rows, you can remove this block.
    for (let j = eqs.length; j < received.length; j++) {
      const r = received[j];
      const emptyDays = Array.from({ length: MAX_DAYS }, () => '').join(',');
      csv += `,${emptyDays},,,${escapeCSVField(r.date)},${escapeCSVField(r.liter === 0 ? '' : r.liter)},${escapeCSVField(r.note)}\n`;
    }

    // Download
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${company || 'company'}-${site || 'site'}-${ym}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

  } catch (e) {
    console.error("Export failed:", e);
    alert("Export failed: " + (e?.message || e));
  }
}
    // ───────────────────────── Render ─────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
